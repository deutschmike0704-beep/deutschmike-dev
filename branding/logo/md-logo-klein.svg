       raster und etwas größer skaliert, damit M und D bei 16 px klar bleiben.
       Die Amber-Knoten tragen die Markenfarbe. ink = currentColor. -->
  <style>svg{color:#231f20}@media (prefers-color-scheme: dark){svg{color:#f4f5f3}}</style>
  <g transform="translate(32 32) scale(1.24) translate(-32 -32)">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M12 48 V16 L21 29 L30 16 V48"/>
