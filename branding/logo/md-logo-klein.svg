    <g fill="#efaa14">
      <circle cx="12" cy="16" r="2.7"/><circle cx="12" cy="48" r="2.7"/><circle cx="21" cy="29" r="2.7"/>
      <circle cx="30" cy="16" r="2.7"/><circle cx="30" cy="48" r="2.7"/><circle cx="52" cy="32" r="2.7"/>
    </g>
