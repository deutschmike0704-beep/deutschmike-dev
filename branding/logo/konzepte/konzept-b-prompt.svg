<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 64" role="img" aria-label="Mike Deutsch – Monogramm" style="color:#121316">
  <!-- Konzept B: Terminal-Prompt ›MD_. Amber-Prompt-Zeichen, MD, blinkender Cursor-Block.
       ink = currentColor, Akzent = var(--lac). -->
  <style>
    @media (prefers-color-scheme: dark){svg{color:#f4f5f3}}
    @media (prefers-reduced-motion: no-preference){ .cur{ animation:blink 1.1s steps(1) infinite } }
    @keyframes blink{ 0%,50%{opacity:1} 50.01%,100%{opacity:0} }
  </style>
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polyline stroke="var(--lac,#efaa14)" points="16,20 30,32 16,44"/>
    <path     stroke="currentColor" d="M44 46 V18 L57 34 L70 18 V46"/>
    <path     stroke="currentColor" d="M80 18 V46 M80 18 H89 C99 18 104 24 104 32 C104 40 99 46 89 46 H80"/>
  </g>
  <rect class="cur" x="114" y="18" width="16" height="28" rx="2" fill="var(--lac,#efaa14)"/>
</svg>
