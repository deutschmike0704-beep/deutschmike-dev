<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  @font-face { font-family:"Poppins"; font-weight:700; font-display:block;
    src:url("../assets/fonts/poppins-700.woff2") format("woff2"); }
  @font-face { font-family:"Poppins"; font-weight:600; font-display:block;
    src:url("../assets/fonts/poppins-600.woff2") format("woff2"); }
  * { margin:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  .card {
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:#0c0d0e; color:#f4f5f3;
    font-family:"Poppins",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    padding:72px 80px; display:flex; flex-direction:column; justify-content:space-between;
  }
  /* Amber-Raster + Glow, wie auf der Seite */
  .card::before { content:""; position:absolute; inset:0;
    background:
      radial-gradient(60rem 40rem at 92% -10%, rgba(239,170,20,0.22), transparent 60%),
      radial-gradient(40rem 34rem at -5% 115%, rgba(243,187,64,0.12), transparent 60%);
  }
  .card::after { content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(239,170,20,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(239,170,20,0.06) 1px, transparent 1px);
    background-size:48px 48px;
    -webkit-mask:radial-gradient(90% 90% at 85% 10%, #000, transparent 72%);
  }
  .row { position:relative; display:flex; align-items:center; gap:26px; }
  .mark { width:84px; height:84px; flex:none; }
  .eyebrow { font-weight:700; font-size:22px; letter-spacing:.14em; text-transform:uppercase;
    color:#efaa14; }
  h1 { position:relative; font-weight:700; font-size:104px; line-height:.98; letter-spacing:-.02em; }
  h1 .amber { color:#efaa14; }
  .role { position:relative; font-weight:600; font-size:34px; line-height:1.25; color:#d8dadf;
    max-width:900px; margin-top:22px; }
  .accent { position:relative; width:84px; height:6px; background:#efaa14; border-radius:3px; margin:30px 0 0; }
  .foot { position:relative; display:flex; align-items:center; justify-content:space-between; }
  .domain { font-weight:700; font-size:30px; color:#efaa14; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .loc { font-weight:600; font-size:26px; color:#a0a6ae; }
</style></head>
<body>
  <div class="card">
    <div>
      <div class="row">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <g stroke="#f4f5f3" stroke-width="1" opacity="0.16"><path d="M8 0V64 M24 0V64 M40 0V64 M56 0V64 M0 8H64 M0 24H64 M0 40H64 M0 56H64"/></g>
          <g fill="none" stroke="#f4f5f3" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M12 48 V16 L21 29 L30 16 V48"/>
            <path d="M30 16 H40 C48 16 52 22 52 32 C52 42 48 48 40 48 H30"/>
          </g>
          <g fill="#efaa14"><circle cx="12" cy="16" r="2.4"/><circle cx="12" cy="48" r="2.4"/><circle cx="21" cy="29" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="30" cy="48" r="2.4"/><circle cx="52" cy="32" r="2.4"/></g>
        </svg>
        <span class="eyebrow">Anwendungsentwicklung</span>
      </div>
      <h1 style="margin-top:40px">Mike <span class="amber">Deutsch</span></h1>
      <p class="role">Vom Metallbau zum Code — angehender Fachinformatiker für Anwendungsentwicklung</p>
      <div class="accent"></div>
    </div>
    <div class="foot">
      <span class="domain">deutschmike.dev</span>
      <span class="loc">Bautzen, Sachsen</span>
    </div>
  </div>
</body></html>
